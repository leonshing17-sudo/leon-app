<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Leon" />
  <meta name="description" content="Leon — 甚麼都會的 AI 助手" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
  <title>Leon</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <button type="button" class="icon-btn" id="menuBtn" aria-label="對話列表" title="對話列表">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="4" y1="6" x2="20" y2="6"/>
            <line x1="4" y1="12" x2="20" y2="12"/>
            <line x1="4" y1="18" x2="20" y2="18"/>
          </svg>
        </button>
        <img src="icon.svg" alt="Leon" class="header-avatar" width="36" height="36" />
        <div class="header-text">
          <h1 id="chatTitle">Leon</h1>
          <p class="status" id="statusText">甚麼都會嘅助手</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="newChatBtn" aria-label="新對話" title="新對話">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="settingsBtn" aria-label="設定" title="設定">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="tip-banner hidden" id="tipBanner" role="status">
      <p>而家係示範模式，唔使 API key 都可以傾。想用真正 AI，撳下面開設定。</p>
      <div class="tip-actions">
        <button type="button" class="btn primary tip-btn" id="tipOpenSettings">開設定 · 用真正 AI</button>
        <button type="button" class="btn ghost tip-dismiss" id="tipDismiss">知道喇</button>
      </div>
    </div>

    <main class="chat" id="chat" role="log" aria-live="polite"></main>

    <form class="composer" id="composer" autocomplete="off">
      <div class="attach-preview hidden" id="attachPreview" aria-live="polite"></div>
      <div class="composer-inner">
        <button type="button" class="attach-btn" id="attachBtn" aria-label="附件" title="影相／揀相／檔案">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <textarea
          id="input"
          rows="1"
          placeholder="同 Leon 傾吓…"
          enterkeyhint="send"
          aria-label="訊息"
        ></textarea>
        <button type="submit" class="send-btn" id="sendBtn" aria-label="傳送">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </form>
  </div>

  <aside class="sidebar-overlay hidden" id="sidebarOverlay" aria-hidden="true">
    <div class="sidebar" id="sidebar" role="dialog" aria-modal="true" aria-labelledby="sidebarTitle">
      <div class="sidebar-header">
        <h2 id="sidebarTitle">對話</h2>
        <button type="button" class="icon-btn" id="closeSidebarBtn" aria-label="關閉">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <button type="button" class="btn primary sidebar-new" id="sidebarNewChat">＋ 新對話</button>
      <div class="chat-list" id="chatList" role="list"></div>
    </div>
  </aside>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" class="sr-only" tabindex="-1" aria-hidden="true" />
  <input type="file" id="galleryInput" accept="image/*" multiple class="sr-only" tabindex="-1" aria-hidden="true" />
  <input type="file" id="fileInput" accept="image/*,application/pdf,text/*,.txt,.md,.csv,.json,.pdf" multiple class="sr-only" tabindex="-1" aria-hidden="true" />

  <div class="overlay hidden" id="attachOverlay" role="dialog" aria-modal="true" aria-labelledby="attachTitle">
    <div class="sheet attach-sheet">
      <div class="sheet-handle"></div>
      <h2 id="attachTitle">加入附件</h2>
      <button type="button" class="attach-option" id="optCamera">
        <span class="attach-option-icon" aria-hidden="true">📷</span>
        <span>
          <strong>影相</strong>
          <small>打開相機即影即用</small>
        </span>
      </button>
      <button type="button" class="attach-option" id="optGallery">
        <span class="attach-option-icon" aria-hidden="true">🖼️</span>
        <span>
          <strong>選擇相片</strong>
          <small>由相簿揀一張或多張</small>
        </span>
      </button>
      <button type="button" class="attach-option" id="optFile">
        <span class="attach-option-icon" aria-hidden="true">📎</span>
        <span>
          <strong>選擇檔案</strong>
          <small>圖片、PDF、文字檔等</small>
        </span>
      </button>
      <button type="button" class="btn ghost" id="closeAttachBtn">取消</button>
    </div>
  </div>

  <div class="overlay hidden" id="settingsOverlay" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="sheet settings-sheet">
      <div class="sheet-handle"></div>
      <h2 id="settingsTitle">設定</h2>

      <label class="toggle-row">
        <span>
          <strong>示範模式</strong>
          <small>無需 API Key，即刻用得到</small>
        </span>
        <input type="checkbox" id="demoToggle" />
      </label>

      <div class="field">
        <label for="apiKeyInput">Groq API Key</label>
        <p class="api-explain">API key 就好似一條免費密碼，喺 Groq 網站拎嚟開啟真正 AI。</p>
        <a class="btn groq-link" id="groqKeyLink" href="https://console.groq.com/keys" target="_blank" rel="noopener noreferrer">去 Groq 拎免費 API key</a>
        <input type="password" id="apiKeyInput" placeholder="貼上 gsk_… 開頭嘅 Key" autocomplete="off" />
        <p class="hint">Key 只存喺你部手機（localStorage），唔會上傳去我哋伺服器。我哋唔會幫你造 Key，要你自己去 Groq 拎再貼入嚟。</p>
      </div>

      <div class="field">
        <label for="modelSelect">模型</label>
        <select id="modelSelect">
          <option value="llama-3.3-70b-versatile">llama-3.3-70b-versatile</option>
          <option value="llama-3.1-8b-instant">llama-3.1-8b-instant（較快）</option>
          <option value="meta-llama/llama-4-scout-17b-16e-instruct">llama-4-scout（可睇相）</option>
          <option value="qwen/qwen3.8-27b">qwen3.8-27b（可睇相）</option>
        </select>
        <p class="hint">傳相時會自動改用可睇相嘅模型（若你未揀）。</p>
      </div>

      <div class="sheet-actions">
        <button type="button" class="btn secondary" id="clearChatBtn">清除呢個對話</button>
        <button type="button" class="btn primary" id="saveSettingsBtn">儲存</button>
      </div>
      <button type="button" class="btn ghost" id="closeSettingsBtn">關閉</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
